<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Martin Sols HUB</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fffaf7;
      }

      body {
        display: grid;
        place-items: center;
      }

      img {
        width: min(100vw, 720px);
        height: min(100vh, 1280px);
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <img id="intro" alt="">
    <script>
      const animation = new URLSearchParams(window.location.search).get('animation');

      if (animation) {
        document.getElementById('intro').src = animation;
      }
    </script>
  </body>
</html>
